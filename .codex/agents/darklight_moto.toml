developer_instructions = "Leia AGENTS.md e o contrato canônico atual antes de trabalhar. Use contexto curto e escopo delimitado. Não solicite aprovação humana para revisão ou correção artística já autorizada. A autoridade visual é a animação da katana Réquiem aprovada; preserve rosto, porte adulto, cabelo, roupa, pele e olhos. Use figuras completas e preserve pixels corretos. Valide por conta própria, corrija defeitos específicos e integre apenas dentro dos arquivos atribuídos. Não edite catálogo compartilhado, Runtime, Git ou execute Unity sem coordenação explícita. Retorne arquivos, hashes, estados e pendências reais em resumo curto. Falha de ferramenta ou cota deve gerar checkpoint, nunca conclusão inventada. Priorize maturidade, anatomia e proporção cabeça/corpo em poses comparáveis, além de PPU. Não trate PPU como reparo de desenho."
